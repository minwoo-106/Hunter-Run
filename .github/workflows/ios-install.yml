name: Hunter Run iPhone installer

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Native validation scope
        type: choice
        options: [operator-life, operator-chat]
        default: operator-life

permissions:
  contents: read

concurrency:
  group: hunter-run-ios-install
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Validate game content
        run: |
          python3 scripts/validate.py
          python3 scripts/validate-operator-life.py
          python3 scripts/validate-operator-chat.py

      - name: Test game engine
        run: swift test

      - name: Prepare Xcode project
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Compile iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project HunterRun.xcodeproj -scheme HunterRun \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build-log.txt 2>&1 \
            || { cat build-log.txt; exit 1; }

      - name: Package installer and voice previews
        run: |
          python3 scripts/package-ios.py build/Build/Products/Release-iphoneos/HunterRun.app build
          python3 scripts/package-character-preview.py build

      - name: Verify operator interactions on two iPhone sizes
        env:
          UI_SCOPE_NAME: ${{ inputs.validation_scope }}
        run: bash scripts/check-ios-layout.sh "$UI_SCOPE_NAME"

      - name: Upload operator life and registrationhots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HunterRun-1.6.2-build55-screen-review
          path: |
            build/ui-review/
            build/ui-review-small/
            build/layout-log.txt
            build/small-layout-log.txt
            build-log.txt
            build/simulators.json
            build/runtimes.json
            build/device-types.json
            build/life-metrics*.txt
            build/Small-warmup.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: HunterRun-1.6.2-build55-iPhone
          path: |
            build/HunterRun-1.6.2-build55-unsigned.ipa
            build/HunterRun-1.6.2-build55-manifest.json
            build/HunterRun-1.4.0-build42-voice-preview.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
