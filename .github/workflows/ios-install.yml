name: Hunter Run operator life PoC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-run-operator-life-poc
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Validate unchanged game content
        run: python3 scripts/validate.py
      - name: Test game engine and life sequence
        run: |
          swift test
          swift test --package-path Prototypes/OperatorLife
      - name: Prepare XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Compile normal app with PoC disabled
        run: |
          set -euo pipefail
          xcodebuild -project HunterRun.xcodeproj -scheme HunterRun -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/production CODE_SIGNING_ALLOWED=NO build > production-build-log.txt 2>&1 || { cat production-build-log.txt; exit 1; }
      - name: Compile isolated iPhone PoC
        run: |
          set -euo pipefail
          xcodegen generate --spec project-operator-poc.yml
          xcodebuild -project HunterRunOperatorPoC.xcodeproj -scheme HunterRun -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/poc CODE_SIGNING_ALLOWED=NO build > poc-build-log.txt 2>&1 || { cat poc-build-log.txt; exit 1; }
          python3 Prototypes/OperatorLife/package-poc.py build/poc/Build/Products/Release-iphoneos/HunterRun.app build
      - name: Verify life sequence on two iPhone sizes
        run: bash Prototypes/OperatorLife/check-ios-poc.sh facilities
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HunterRun-OperatorLife-PoC-build51-review
          path: |
            build/ui-review/
            build/ui-review-small/
            build/layout-log.txt
            build/small-layout-log.txt
            build/life-metrics*.txt
            build/life-preview*.mp4
            build/*layout.png
            production-build-log.txt
            poc-build-log.txt
            build/simulators.json
            build/runtimes.json
            build/device-types.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified PoC installer
        uses: actions/upload-artifact@v4
        with:
          name: HunterRun-OperatorLife-PoC-build51-iPhone
          path: |
            build/HunterRun-OperatorLife-PoC-build51-unsigned.ipa
            build/HunterRun-OperatorLife-PoC-build51-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
