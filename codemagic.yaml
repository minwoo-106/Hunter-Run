workflows:
  ios-demo:
    name: Hunter Run - free personal demo
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Validate content and files
        script: python3 scripts/validate.py
      - name: Test portable game engine
        script: swift test
      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Compile iPhone app
        script: |
          set -euo pipefail
          xcodebuild -project HunterRun.xcodeproj -scheme HunterRun \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build-log.txt 2>&1 || { cat build-log.txt; exit 1; }
      - name: Package unsigned IPA for personal signing
        script: |
          set -euo pipefail
          mkdir -p build/package/Payload
          cp -R build/Build/Products/Release-iphoneos/HunterRun.app build/package/Payload/
          cd build/package
          zip -qr ../HunterRun-unsigned.ipa Payload
    artifacts:
      - build/HunterRun-unsigned.ipa
      - build-log.txt
