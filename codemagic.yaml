workflows:
  ios-workout-validation:
    name: Hunter Run - 운동 개편과 전환 복귀 검증 (설치 파일 없음)
    instance_type: mac_mini_m2
    max_build_duration: 35
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-verify-workout-*'
          include: true
    environment:
      xcode: latest
    scripts:
      - name: Test portable game engine and content
        script: |
          set -euo pipefail
          python3 scripts/validate.py
          swift test > core-test-log.txt 2>&1 || { cat core-test-log.txt; exit 1; }
      - name: Generate simulator project
        script: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -downloadComponent MetalToolchain
      - name: Verify transitions and indoor exercise in simulator
        script: bash scripts/check-ios-layout.sh workout-v2
    artifacts:
      - core-test-log.txt
      - build/layout-log.txt
      - build/small-layout-log.txt
      - build/Layout.xcresult
      - build/Small-layout.xcresult
      - build/ui-review/*.png
      - build/ui-review/*.json
      - build/ui-review-small/*.png
      - build/ui-review-small/*.json
  ios-layout-check:
    name: Hunter Run - iPhone layout check
    instance_type: mac_mini_m2
    max_build_duration: 20
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-layout-*'
          include: true
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -downloadComponent MetalToolchain
      - name: Check home layout in iPhone simulator
        script: bash scripts/check-compact-layout.sh
    artifacts:
      - build/Home-layout.png
      - build/layout-log.txt
      - build/Layout.xcresult
      - build/Small-layout.png
      - build/small-layout-log.txt
      - build/Small-layout.xcresult
      - build/portrait-checks/*.png
      - build/life-metrics*.txt
  ios-demo:
    name: Hunter Run 1.8.1 - 운동 개편과 전환 복귀 수정
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-build-*'
          include: true
    environment:
      xcode: latest
    scripts:
      - name: Validate content and files
        script: |
          python3 scripts/validate.py
          python3 scripts/validate-operator-life.py
      - name: Test portable game engine
        script: |
          set -euo pipefail
          swift test
          swift run --skip-build HunterDebugRunner --output build/combat-replay
          python3 scripts/build-combat-replay-review.py build/combat-replay
      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -downloadComponent MetalToolchain
      - name: Compile iPhone app
        script: |
          set -euo pipefail
          xcodebuild -project HunterRun.xcodeproj -scheme HunterRun \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build-log.txt 2>&1 || { cat build-log.txt; exit 1; }
      - name: Check home layout in iPhone simulator
        script: bash scripts/check-ios-layout.sh workout-v2
      - name: Package unsigned IPA for personal signing
        script: |
          set -euo pipefail
          python3 scripts/package-ios.py build/Build/Products/Release-iphoneos/HunterRun.app build
          python3 scripts/verify-installer.py build/HunterRun-1.8.1-build62-unsigned.ipa --version 1.8.1 --build 62 --output build/HunterRun-1.8.1-build62-verification.json
      - name: Package season-one character voice previews
        script: python3 scripts/package-character-preview.py build
    artifacts:
      - build/HunterRun-*-install.zip
      - build/HunterRun-*-unsigned.ipa
      - build/HunterRun-*-manifest.json
      - build/HunterRun-*-verification.json
      - build/HunterRun-*-voice-preview.zip
      - build/ui-review/*.png
      - build/ui-review/*.json
      - build/ui-review-small/*.png
      - build/ui-review-small/*.json
      - build/combat-replay/**
      - build-log.txt
      - build/Home-layout.png
      - build/layout-log.txt
      - build/Layout.xcresult
      - build/Small-layout.png
      - build/small-layout-log.txt
      - build/Small-layout.xcresult
      - build/portrait-checks/*.png
      - build/life-metrics*.txt
