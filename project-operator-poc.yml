name: HunterRunOperatorPoC
options:
  bundleIdPrefix: com.hunterrun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPERATOR_LIFE_POC"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG OPERATOR_LIFE_POC"
targets:
  HunterRun:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/HunterCore
      - path: Resources
      - path: Prototypes/OperatorLife/Core
      - path: Prototypes/OperatorLife/SwiftUI
      - path: Prototypes/OperatorLife/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hunterrun.operatorpoc
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: 51
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Prototypes/OperatorLife/Info.plist
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: false
      testTargets:
        - HunterRunUITests
  HunterRunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Prototypes/OperatorLife/UITests
    dependencies:
      - target: HunterRun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hunterrun.operatorpoc.uitests
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
