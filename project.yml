name: HunterRun
options:
  bundleIdPrefix: com.hunterrun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  HunterRun:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/HunterCore
      - path: Sources/OperatorLifeCore
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hunterrun.demo
        MARKETING_VERSION: "1.6.3"
        CURRENT_PROJECT_VERSION: 56
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: false
      testTargets:
        - HunterRunUITests
  HunterRunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HunterRun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hunterrun.demo.uitests
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
